<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - ACCESS CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --bg: #000; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .login-card { background: rgba(0, 20, 20, 0.8); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); box-shadow: 0 0 20px var(--neon); text-align: center; width: 300px; }
        input { width: 90%; padding: 12px; margin: 20px 0; background: #000; border: 1px solid var(--neon); color: #fff; border-radius: 10px; outline: none; text-align: center; }
        button { background: var(--neon); color: #000; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { box-shadow: 0 0 15px var(--neon); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-user-shield" style="font-size: 40px;"></i>
        <h2>SYSTEM LOGIN</h2>
        <input type="password" id="pass" placeholder="Enter Access Key">
        <button onclick="login()">AUTHORIZE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE", authDomain: "herovee.firebaseapp.com", projectId: "herovee", storageBucket: "herovee.firebasestorage.app", messagingSenderId: "700112828047", appId: "1:700112828047:web:988f0598b5341a29bba2fa" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = () => {
            const p = document.getElementById('pass').value;
            // SIYAM বস, আপনার ইমেইল দিয়ে লগইন লজিক
            signInWithEmailAndPassword(auth, "sadaf245sz@gmail.com", p)
                .then(() => { window.location.href = "vault.html"; })
                .catch(() => { alert("ACCESS DENIED, BOSS!"); });
        };
    </script>
</body>
</html>
