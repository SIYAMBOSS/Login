<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE AI - Voice Edition</title>
    <style>
        :root { --bg: #131314; --panel: #1e1f20; --text: #e3e3e3; --accent: #4285f4; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .header { padding: 20px; text-align: center; font-size: 24px; font-weight: bold; color: var(--accent); border-bottom: 1px solid #333; }

        /* Chat Window */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15px; position: relative; }
        .user-msg { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .ai-msg { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px; border: 1px solid #333; }

        /* Input Area */
        .input-area { padding: 20px; background: var(--bg); display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        input { flex: 1; background: var(--panel); border: 1px solid #444; border-radius: 25px; padding: 12px 20px; color: white; outline: none; }
        button { background: var(--accent); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; color: white; transition: 0.3s; }
        button:hover { opacity: 0.8; }

        /* Voice Icon */
        .speaker-icon { cursor: pointer; margin-left: 8px; font-size: 12px; color: #aaa; vertical-align: middle; }
    </style>
</head>
<body>

<div class="header">HEROVEE AI</div>

<div id="chat-window">
    <div class="message ai-msg">হ্যালো! আমি HEROVEE। আজ আপনাকে কীভাবে সাহায্য করতে পারি?</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="এখানে লিখুন..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
</div>

<script>
    const API_KEY = "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";
    const chatWindow = document.getElementById('chat-window');

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        // User message add
        addMessage(text, 'user-msg');
        input.value = '';

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;
            
            // AI message add
            addMessage(aiText, 'ai-msg', true);
        } catch (error) {
            addMessage("দুঃখিত, কোনো সমস্যা হয়েছে।", 'ai-msg');
        }
    }

    function addMessage(text, className, isAI = false) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;

        if (isAI) {
            const speakBtn = document.createElement('span');
            speakBtn.className = 'speaker-icon';
            speakBtn.innerText = " 🔊 শুনুন";
            speakBtn.onclick = () => speak(text);
            div.appendChild(speakBtn);
        }

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function speak(text) {
        // ব্রাউজারের টেক্সট-টু-স্পিচ ইঞ্জিন ব্যবহার
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'bn-BD'; // বাংলা ভাষা সেট করা
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
