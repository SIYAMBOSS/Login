<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - VISION INTERFACE 2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #45f3ff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        
        /* ম্যাট্রিক্স ব্যাকগ্রাউন্ড */
        #bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.2; }

        .main-interface { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }

        /* MYRA স্টাইল গ্লোয়িং রিং */
        .core-container { position: relative; width: 250px; height: 250px; display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid #45f3ff33; }
        .ring1 { width: 100%; height: 100%; border-top: 2px solid #45f3ff; animation: spin 4s linear infinite; }
        .ring2 { width: 85%; height: 85%; border-bottom: 2px solid #ffee00; animation: spinRev 3s linear infinite; }
        .core-circle { width: 120px; height: 120px; background: radial-gradient(circle, #45f3ff33, #000); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #45f3ff; box-shadow: 0 0 20px #45f3ff; transition: 0.3s; }
        .core-circle.talking { box-shadow: 0 0 50px #ffee00; border-color: #ffee00; }
        .core-text { font-weight: bold; font-size: 18px; letter-spacing: 2px; color: #45f3ff; text-shadow: 0 0 10px #45f3ff; }

        /* স্ট্যাটাস বার (MYRA স্টাইল) */
        .stats-left, .stats-right { position: absolute; top: 20px; font-size: 10px; text-transform: uppercase; background: rgba(0,255,255,0.05); padding: 10px; border: 1px solid #45f3ff22; }
        .stats-left { left: 20px; text-align: left; }
        .stats-right { right: 20px; text-align: right; }

        /* চ্যাট বক্স */
        #aiChatBox { width: 90%; max-width: 400px; height: 120px; margin-top: 30px; overflow-y: auto; background: rgba(0,0,0,0.8); border: 1px solid #45f3ff33; border-radius: 5px; padding: 10px; font-size: 12px; }
        
        /* ইনপুট এরিয়া */
        .control-panel { margin-top: 20px; display: flex; gap: 10px; width: 90%; max-width: 400px; }
        input { flex: 1; background: #000; border: 1px solid #45f3ff55; color: #45f3ff; padding: 10px; outline: none; }
        button { background: transparent; border: 1px solid #45f3ff; color: #45f3ff; padding: 10px 15px; cursor: pointer; }
        button:hover { background: #45f3ff; color: #000; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="main-interface">
    <div class="stats-left">
        SYSTEM: ACTIVE<br>CPU: 42%<br>TEMP: 38°C<br>BOSS: SIYAM
    </div>
    <div class="stats-right">
        MEMORY: 2.4GB<br>SIGNAL: STABLE<br>LOC: DHAKA<br>MOD: VISION 2.0
    </div>

    <div class="core-container">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="core-circle" id="core">
            <div class="core-text" id="statusText">HEROVEE</div>
        </div>
    </div>

    <div id="aiChatBox">
        [SYSTEM] Welcome Boss Siyam. HEROVEE is standing by.
    </div>

    <div class="control-panel">
        <button onclick="startListening()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="aiInput" placeholder="CMD_INPUT..." onkeypress="if(event.key === 'Enter') askAI()">
        <button onclick="askAI()">EXEC</button>
    </div>
</div>

<script>
const GROQ_API_KEY = "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";

// ব্যাকগ্রাউন্ড এনিমেশন
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const words = "010101 HEROVEE SIYAM BOSS SYSTEM VISION";
const fontSize = 10;
const columns = canvas.width/fontSize;
const drops = [];
for(let x = 0; x < columns; x++) drops[x] = 1;

function drawBg() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#45f3ff";
    ctx.font = fontSize + "px arial";
    for(let i = 0; i < drops.length; i++) {
        const text = words[Math.floor(Math.random()*words.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawBg, 33);

// কথা বলা ও এনিমেশন
function speak(text) {
    const synth = window.speechSynthesis;
    const utterance = new SpeechSynthesisUtterance(text);
    const core = document.getElementById('core');
    const statusText = document.getElementById('statusText');

    utterance.onstart = () => { 
        core.classList.add('talking'); 
        statusText.innerText = "SPEAKING";
    };
    utterance.onend = () => { 
        core.classList.remove('talking'); 
        statusText.innerText = "HEROVEE";
    };

    utterance.pitch = 1.2;
    synth.speak(utterance);
}

async function askAI() {
    const inputField = document.getElementById('aiInput');
    const userInput = inputField.value.trim();
    if (!userInput) return;

    const chatBox = document.getElementById('aiChatBox');
    chatBox.innerHTML += `<div>[BOSS]: ${userInput}</div>`;
    inputField.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [{ role: "system", content: "You are HEROVEE, a high-tech female AI. You serve Siyam Boss. Keep replies sharp and tech-savvy." }, { role: "user", content: userInput }]
            })
        });
        const data = await response.json();
        const aiMsg = data.choices[0].message.content;
        chatBox.innerHTML += `<div style="color:#ffee00">[HEROVEE]: ${aiMsg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        speak(aiMsg);
    } catch (e) { chatBox.innerHTML += `<div>[ERR]: API_FAILURE</div>`; }
}

function startListening() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US'; 
    recognition.onstart = () => { document.getElementById('statusText').innerText = "LISTENING"; };
    recognition.onresult = (e) => { document.getElementById('aiInput').value = e.results[0][0].transcript; askAI(); };
    recognition.onend = () => { document.getElementById('statusText').innerText = "HEROVEE"; };
    recognition.start();
}
</script>
</body>
    </html>
