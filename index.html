<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - PREMIER VISION INTERFACE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #45f3ff; font-family: 'Consolas', monospace; overflow: hidden; }
        
        /* ব্যাকগ্রাউন্ড স্ক্যান লাইন */
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 255, 0.2); position: absolute; top: 0; left: 0; z-index: 10; animation: scan 4s linear infinite; box-shadow: 0 0 15px #45f3ff; }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        .main-interface { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 5; }

        /* প্রিমিয়াম কোর ডিজাইন */
        .core-wrapper { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; perspective: 1000px; }
        .ring-premium { position: absolute; border-radius: 50%; border: 2px solid transparent; mix-blend-mode: screen; }
        
        /* ৪টি ভিন্ন গতির রিং */
        .r1 { width: 100%; height: 100%; border-top: 3px solid #45f3ff; animation: spin 4s linear infinite; filter: drop-shadow(0 0 10px #45f3ff); }
        .r2 { width: 85%; height: 85%; border-left: 2px solid #ffee00; animation: spinRev 6s linear infinite; opacity: 0.7; }
        .r3 { width: 72%; height: 72%; border-right: 2px solid #ff00ea; animation: spin 8s ease-in-out infinite; opacity: 0.5; }
        .r4 { width: 115%; height: 115%; border: 1px dashed rgba(69, 243, 255, 0.3); animation: spinRev 15s linear infinite; }

        /* কাঁচের মতো গোলক (Glass Sphere) */
        .main-orb {
            width: 140px; height: 140px;
            background: radial-gradient(circle at 30% 30%, rgba(69, 243, 255, 0.2), rgba(0, 0, 0, 0.9));
            border-radius: 50%; border: 1px solid rgba(69, 243, 255, 0.6);
            box-shadow: 0 0 40px rgba(69, 243, 255, 0.4), inset 0 0 20px rgba(69, 243, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            position: relative; z-index: 10; backdrop-filter: blur(5px); transition: all 0.5s ease;
        }

        .main-orb.talking { box-shadow: 0 0 80px rgba(69, 243, 255, 0.8); border-color: #ffee00; transform: scale(1.05); }
        .orb-text { font-weight: 900; font-size: 18px; letter-spacing: 4px; color: #45f3ff; text-shadow: 0 0 15px #45f3ff; }

        /* স্ট্যাটাস প্যানেল */
        .stats { position: absolute; padding: 15px; background: rgba(0, 255, 255, 0.03); border: 1px solid rgba(69, 243, 255, 0.1); font-size: 11px; width: 145px; }
        .stats-left { top: 30px; left: 30px; border-left: 4px solid #45f3ff; }
        .stats-right { top: 30px; right: 30px; border-right: 4px solid #ffee00; text-align: right; }

        /* চ্যাট বক্স */
        #aiChatBox { width: 90%; max-width: 420px; height: 150px; margin-top: 40px; overflow-y: auto; background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(69, 243, 255, 0.2); padding: 15px; font-size: 13px; scrollbar-width: none; }
        
        /* কন্ট্রোল প্যানেল */
        .controls { margin-top: 25px; display: flex; gap: 12px; width: 90%; max-width: 420px; }
        input { flex: 1; background: transparent; border: 1px solid rgba(69, 243, 255, 0.4); color: #45f3ff; padding: 12px; outline: none; }
        .btn { background: transparent; border: 1px solid #45f3ff; color: #45f3ff; padding: 10px 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 5px rgba(69, 243, 255, 0.2); }
        .btn:hover { background: #45f3ff; color: #000; box-shadow: 0 0 15px #45f3ff; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="main-interface">
    <div class="stats stats-left">
        > SYSTEM: ACTIVE<br>
        > CPU: <span id="cpuLoad">45</span>%<br>
        > TEMP: <span id="tempVal">37</span>°C<br>
        > BOSS: SIYAM
    </div>
    <div class="stats stats-right">
        > MEMORY: <span id="memLoad">2.6</span>GB<br>
        > SIGNAL: STABLE<br>
        > MOD: VISION PRO<br>
        > 2026-03-11
    </div>

    <div class="core-wrapper">
        <div class="ring-premium r4"></div>
        <div class="ring-premium r1"></div>
        <div class="ring-premium r2"></div>
        <div class="ring-premium r3"></div>
        <div class="main-orb" id="core">
            <span class="orb-text" id="statusLabel">HEROVEE</span>
        </div>
    </div>

    <div id="aiChatBox">
        [SYS] Initializing HEROVEE Vision PRO...<br>
        [SYS] Boss Siyam, ready for command.
    </div>

    <div class="controls">
        <button class="btn" onclick="startListening()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="aiInput" placeholder="CMD_INPUT..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn" onclick="askAI()">EXEC</button>
    </div>
</div>

<script>
// আপনার লেটেস্ট API Key আপডেট করা হয়েছে
const API_KEY = "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";

setInterval(() => {
    document.getElementById('cpuLoad').innerText = Math.floor(Math.random() * 15) + 35;
    document.getElementById('memLoad').innerText = (Math.random() * (2.9 - 2.4) + 2.4).toFixed(1);
}, 3000);

function speak(text) {
    const synth = window.speechSynthesis;
    const utterance = new SpeechSynthesisUtterance(text);
    const core = document.getElementById('core');
    const label = document.getElementById('statusLabel');
    const isBengali = /[\u0980-\u09FF]/.test(text); // বাংলা ডিটেকশন

    utterance.onstart = () => { core.classList.add('talking'); label.innerText = "TALKING"; };
    utterance.onend = () => { core.classList.remove('talking'); label.innerText = "HEROVEE"; };

    if(isBengali) utterance.lang = 'bn-BD';
    else utterance.lang = 'en-US';

    const voices = synth.getVoices();
    const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google UK English Female'));
    if (femaleVoice) utterance.voice = femaleVoice;

    utterance.pitch = 1.3;
    synth.speak(utterance);
}

async function askAI() {
    const input = document.getElementById('aiInput');
    const chat = document.getElementById('aiChatBox');
    const text = input.value.trim();
    if (!text) return;

    chat.innerHTML += `<div>[BOSS]: ${text}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [{ role: "system", content: "You are HEROVEE, a professional female AI for Siyam Boss. Speak in the same language he uses." }, { role: "user", content: text }]
            })
        });
        const data = await res.json();
        const aiMsg = data.choices[0].message.content;
        chat.innerHTML += `<div style="color:#ffee00">[HEROVEE]: ${aiMsg}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speak(aiMsg);
    } catch (e) { chat.innerHTML += `<div style="color:red">[ERR]: API_AUTH_FAILED</div>`; }
}

function startListening() {
    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'bn-BD'; 
    recognition.onstart = () => { document.getElementById('statusLabel').innerText = "LISTENING"; };
    recognition.onresult = (e) => { document.getElementById('aiInput').value = e.results[0][0].transcript; askAI(); };
    recognition.onend = () => { document.getElementById('statusLabel').innerText = "HEROVEE"; };
    recognition.start();
}
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
