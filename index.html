<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - Groq AI</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; background: #0f172a; color: white; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #0ea5e9; transform: translateY(-2px); }
        #response { margin-top: 20px; padding: 15px; background: #334155; border-radius: 8px; min-height: 60px; text-align: left; font-size: 14px; white-space: pre-wrap; line-height: 1.5; border-left: 4px solid #38bdf8; }
        .loader { display: none; margin: 15px auto; border: 3px solid #f3f3f3; border-top: 3px solid #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>HEROVEE Groq AI</h2>
    <input type="password" id="apiKey" placeholder="Groq API Key দিন" value="">
    <textarea id="userInput" rows="4" placeholder="AI-কে কিছু জিজ্ঞেস করুন..."></textarea>
    <button onclick="askGroq()">মেসেজ পাঠান</button>
    
    <div class="loader" id="loader"></div>
    <div id="response">উত্তর এখানে দেখা যাবে...</div>
</div>

<script>
    async function askGroq() {
        const apiKey = document.getElementById('apiKey').value || "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";
        const userInput = document.getElementById('userInput').value;
        const responseDiv = document.getElementById('response');
        const loader = document.getElementById('loader');

        if (!userInput) {
            alert("কিছু তো লিখুন!");
            return;
        }

        responseDiv.innerText = "Groq চিন্তা করছে...";
        loader.style.display = "block";

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: userInput }]
                })
            });

            const data = await response.json();
            loader.style.display = "none";

            if (data.choices && data.choices[0]) {
                responseDiv.innerText = data.choices[0].message.content;
            } else {
                responseDiv.innerText = "Error: " + (data.error ? data.error.message : "সমস্যা হয়েছে।");
            }
        } catch (error) {
            loader.style.display = "none";
            responseDiv.innerText = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
