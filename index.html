<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; display: flex; 
            align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .login-container {
            width: 85%;
            max-width: 360px;
            background-color: #0c0c0c;
            padding: 60px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #ffffff;
            margin-bottom: 45px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            background-color: #1a1a1a;
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .input-field::placeholder {
            color: #4a4a4a;
        }

        .signin-btn {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4d94 0%, #ffcc33 100%);
            color: #000;
            cursor: pointer;
            transition: 0.3s;
        }

        .signin-btn:active {
            transform: scale(0.98);
        }

        .footer-nav {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }

        .footer-nav a {
            color: #555;
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }

        .footer-nav a:hover {
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-logo">HEROVEE</div>
        
        <input type="email" id="email" class="input-field" placeholder="Gmail Address" value="sadaf245sz@gmail.com">
        <input type="password" id="pass" class="input-field" placeholder="Password">

        <button class="signin-btn" onclick="handleLogin()">SIGN IN</button>

        <div class="footer-nav">
            <a href="#">Forget Password</a>
            <a href="#">Create Account</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE", 
            authDomain: "herovee.firebaseapp.com", 
            projectId: "herovee", 
            storageBucket: "herovee.firebasestorage.app", 
            messagingSenderId: "700112828047", 
            appId: "1:700112828047:web:988f0598b5341a29bba2fa" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = () => {
            const email = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const btn = document.querySelector('.signin-btn');
            
            if(!p) return;
            btn.innerText = "WAITING...";

            signInWithEmailAndPassword(auth, email, p)
                .then(() => { 
                    window.location.href = "vault.html"; 
                })
                .catch(() => { 
                    alert("INVALID ACCESS!"); 
                    btn.innerText = "SIGN IN";
                });
        };
    </script>
</body>
</html>
