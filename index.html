<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - X-VISION PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #45f3ff; font-family: 'Consolas', monospace; overflow: hidden; }
        
        /* ডাইনামিক ব্যাকগ্রাউন্ড গ্রিড */
        .grid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(69, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(69, 243, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }

        .scanline { width: 100%; height: 4px; background: rgba(0, 255, 255, 0.1); position: absolute; z-index: 10; animation: scan 3s linear infinite; opacity: 0.5; }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        .main-interface { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 5; }

        /* হাই-এন্ড কোর ডিজাইন */
        .core-wrapper { position: relative; width: 350px; height: 350px; display: flex; justify-content: center; align-items: center; }
        .ring-premium { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        
        .r1 { width: 100%; height: 100%; border-top: 4px solid #45f3ff; animation: spin 3s linear infinite; filter: drop-shadow(0 0 15px #45f3ff); }
        .r2 { width: 88%; height: 88%; border-bottom: 2px solid #ffee00; animation: spinRev 5s linear infinite; }
        .r3 { width: 75%; height: 75%; border-left: 2px solid #ff00ea; animation: spin 7s ease-in-out infinite; opacity: 0.6; }
        .r4 { width: 120%; height: 120%; border: 1px dashed rgba(69, 243, 255, 0.2); animation: spinRev 20s linear infinite; }

        /* গ্লাস মরফিজম স্ফিয়ার */
        .main-orb {
            width: 150px; height: 150px;
            background: radial-gradient(circle at 35% 35%, rgba(69, 243, 255, 0.25), #000);
            border-radius: 50%; border: 2px solid rgba(69, 243, 255, 0.5);
            box-shadow: 0 0 50px rgba(69, 243, 255, 0.3), inset 0 0 30px rgba(69, 243, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            z-index: 10; backdrop-filter: blur(8px); transition: 0.4s;
        }

        .main-orb.talking { box-shadow: 0 0 100px rgba(69, 243, 255, 0.7); border-color: #ffee00; transform: scale(1.08); }
        .orb-text { font-weight: 900; font-size: 20px; letter-spacing: 5px; color: #45f3ff; text-shadow: 0 0 20px #45f3ff; animation: pulseText 2s infinite; }

        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* স্ট্যাটাস সাইডবার */
        .hud-panel { position: absolute; padding: 15px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(69, 243, 255, 0.2); font-size: 11px; width: 150px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .hud-left { top: 40px; left: 40px; border-left: 5px solid #45f3ff; }
        .hud-right { top: 40px; right: 40px; border-right: 5px solid #ffee00; text-align: right; }

        /* চ্যাট ইন্টারফেস */
        #aiChatBox { width: 90%; max-width: 450px; height: 160px; margin-top: 40px; overflow-y: auto; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(69, 243, 255, 0.3); border-radius: 5px; padding: 15px; font-size: 13px; scrollbar-width: none; line-height: 1.5; }
        
        /* কন্ট্রোল প্যানেল */
        .controls { margin-top: 25px; display: flex; gap: 15px; width: 90%; max-width: 450px; }
        input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(69, 243, 255, 0.5); color: #45f3ff; padding: 12px 20px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ffee00; box-shadow: 0 0 10px rgba(255, 238, 0, 0.2); }
        .btn { background: transparent; border: 1px solid #45f3ff; color: #45f3ff; padding: 10px 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn:hover { background: #45f3ff; color: #000; box-shadow: 0 0 20px #45f3ff; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="main-interface">
    <div class="hud-panel hud-left">
        > NODE: ACTIVE<br>
        > CPU: <span id="cpu">48</span>%<br>
        > TEMP: <span id="temp">36</span>°C<br>
        > USER: SIYAM_BOSS
    </div>
    <div class="hud-panel hud-right">
        > LINK: SECURE<br>
        > RAM: <span id="ram">2.7</span>GB<br>
        > LATENCY: 24ms<br>
        > VER: 3.0.1_X
    </div>

    <div class="core-wrapper">
        <div class="ring-premium r4"></div>
        <div class="ring-premium r1"></div>
        <div class="ring-premium r2"></div>
        <div class="ring-premium r3"></div>
        <div class="main-orb" id="core">
            <span class="orb-text" id="statusLabel">HEROVEE</span>
        </div>
    </div>

    <div id="aiChatBox">
        [LOGIN] Auth Success...<br>
        [SYSTEM] HEROVEE X-VISION is online.<br>
        [STATUS] Awaiting boss command...
    </div>

    <div class="controls">
        <button class="btn" onclick="startListening()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="aiInput" placeholder="ENTER COMMAND..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn" onclick="askAI()">EXECUTE</button>
    </div>
</div>

<script>
// নতুন API Key এখানে বসানো হয়েছে
const API_KEY = "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";

// ডাইনামিক স্ট্যাটাস আপডেট
setInterval(() => {
    document.getElementById('cpu').innerText = Math.floor(Math.random() * 10) + 40;
    document.getElementById('ram').innerText = (Math.random() * (3.1 - 2.5) + 2.5).toFixed(1);
}, 2500);

function speak(text) {
    const synth = window.speechSynthesis;
    const utterance = new SpeechSynthesisUtterance(text);
    const core = document.getElementById('core');
    const label = document.getElementById('statusLabel');
    const isBengali = /[\u0980-\u09FF]/.test(text);

    utterance.onstart = () => { core.classList.add('talking'); label.innerText = "ACTIVE"; };
    utterance.onend = () => { core.classList.remove('talking'); label.innerText = "HEROVEE"; };

    utterance.lang = isBengali ? 'bn-BD' : 'en-US';
    utterance.pitch = 1.3;
    utterance.rate = 1.0;
    
    // সুন্দর ভয়েস সিলেক্ট করা
    const voices = synth.getVoices();
    const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google UK English Female'));
    if (femaleVoice) utterance.voice = femaleVoice;

    synth.speak(utterance);
}

async function askAI() {
    const input = document.getElementById('aiInput');
    const chat = document.getElementById('aiChatBox');
    const text = input.value.trim();
    if (!text) return;

    chat.innerHTML += `<div style="color: #fff;">[BOSS]: ${text}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${API_KEY}`, 
                "Content-Type": "application/json" 
            },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [
                    { role: "system", content: "You are HEROVEE, a high-tech AI developed for Siyam Boss. You are smart, loyal, and efficient. Use Bengali or English as per Siyam's choice." },
                    { role: "user", content: text }
                ]
            })
        });
        const data = await res.json();
        const aiMsg = data.choices[0].message.content;
        chat.innerHTML += `<div style="color:#ffee00">[HEROVEE]: ${aiMsg}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speak(aiMsg);
    } catch (e) { 
        chat.innerHTML += `<div style="color:#ff3c7b;">[ERROR]: LINK_FAILURE_OR_INVALID_KEY</div>`; 
    }
}

function startListening() {
    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'bn-BD';
    recognition.onstart = () => { document.getElementById('statusLabel').innerText = "SYNCING"; };
    recognition.onresult = (e) => { document.getElementById('aiInput').value = e.results[0][0].transcript; askAI(); };
    recognition.onend = () => { document.getElementById('statusLabel').innerText = "HEROVEE"; };
    recognition.start();
}
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
