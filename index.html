<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - ULTIMATE X-VISION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --gold: #ffee00; --pink: #ff00ea; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: var(--neon); font-family: 'Orbitron', 'Consolas', monospace; overflow: hidden; }
        
        /* 3D গ্রিড ব্যাকগ্রাউন্ড */
        .bg-container { position: fixed; width: 100%; height: 100%; perspective: 1000px; z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: 
            linear-gradient(var(--neon) 1px, transparent 1px), 
            linear-gradient(90deg, var(--neon) 1px, transparent 1px);
            background-size: 50px 50px; transform: rotateX(60deg); opacity: 0.1; animation: moveGrid 15s linear infinite; }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(50px); } }

        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }

        /* আল্ট্রা প্রিমিয়াম কোর */
        .core-box { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; transition: 0.3s; }
        .r1 { width: 100%; height: 100%; border-top: 3px solid var(--neon); animation: spin 4s linear infinite; filter: drop-shadow(0 0 10px var(--neon)); }
        .r2 { width: 85%; height: 85%; border-right: 2px solid var(--gold); animation: spinRev 6s linear infinite; }
        .r3 { width: 70%; height: 70%; border-left: 2px solid var(--pink); animation: spin 3s ease-in-out infinite; opacity: 0.6; }
        
        .center-orb {
            width: 130px; height: 130px; background: radial-gradient(circle, #002222, #000);
            border-radius: 50%; border: 1px solid var(--neon); display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px rgba(69, 243, 255, 0.3), inset 0 0 20px rgba(0,0,0,1);
            z-index: 10; cursor: pointer;
        }
        .center-orb.active { animation: pulseCore 0.8s infinite alternate; border-color: var(--gold); box-shadow: 0 0 60px rgba(255, 238, 0, 0.5); }
        @keyframes pulseCore { from { transform: scale(1); } to { transform: scale(1.1); } }
        .orb-label { font-size: 16px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px var(--neon); }

        /* HUD ডিসপ্লে */
        .hud-pnl { position: absolute; padding: 12px; background: rgba(0, 20, 20, 0.6); border: 1px solid rgba(69, 243, 255, 0.2); font-size: 11px; width: 130px; backdrop-filter: blur(10px); }
        .hud-l { top: 20px; left: 20px; border-left: 3px solid var(--neon); }
        .hud-r { top: 20px; right: 20px; border-right: 3px solid var(--gold); text-align: right; }

        /* চ্যাট এরিয়া */
        #chatDisplay { width: 90%; max-width: 450px; height: 160px; margin-top: 40px; overflow-y: auto; background: rgba(0,0,0,0.85); border: 1px solid rgba(69, 243, 255, 0.2); padding: 15px; font-size: 13px; scrollbar-width: none; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* কন্ট্রোলস */
        .controls { margin-top: 25px; display: flex; gap: 10px; width: 90%; max-width: 450px; }
        input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(69, 243, 255, 0.4); color: #fff; padding: 12px; outline: none; border-radius: 4px; }
        .btn { border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .btn-exe { background: var(--neon); color: #000; }
        .btn-mic { background: var(--gold); color: #000; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="bg-container"><div class="grid"></div></div>

<div class="main-ui">
    <div class="hud-pnl hud-l">> SYSTEM: READY<br>> CPU: <span id="cpu">40</span>%<br>> BOSS: SIYAM</div>
    <div class="hud-pnl hud-r">> SECURE: SSL<br>> LATENCY: 9ms<br>> VISION: 6.0</div>

    <div class="core-box">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="center-orb" id="orbCore">
            <span class="orb-label" id="statusLab">HEROVEE</span>
        </div>
    </div>

    <div id="chatDisplay">[SYS] Model Updated to Llama-3.3. Welcome Boss Siyam.</div>

    <div class="controls">
        <button class="btn btn-mic" onclick="startMic()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="Ask HEROVEE..." onkeypress="if(event.key === 'Enter') askHEROVEE()">
        <button class="btn btn-exe" onclick="askHEROVEE()">EXECUTE</button>
    </div>
</div>

<script>
// আপডেট করা সঠিক API KEY এবং নতুন মডেল
const KEY = "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";
const MODEL = "llama-3.3-70b-versatile"; 

function speak(text) {
    const synth = window.speechSynthesis;
    const utter = new SpeechSynthesisUtterance(text);
    const orb = document.getElementById('orbCore');
    const lab = document.getElementById('statusLab');

    utter.onstart = () => { orb.classList.add('active'); lab.innerText = "TALKING"; };
    utter.onend = () => { orb.classList.remove('active'); lab.innerText = "HEROVEE"; };

    utter.lang = /[\u0980-\u09FF]/.test(text) ? 'bn-BD' : 'en-US';
    utter.pitch = 1.3;
    synth.speak(utter);
}

async function askHEROVEE() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chatDisplay');
    const text = input.value.trim();
    if(!text) return;

    chat.innerHTML += `<div style="color:#fff; margin-bottom:8px;">[BOSS]: ${text}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    { role: "system", content: "You are HEROVEE, a high-tech female AI assistant for Siyam Boss. You are loyal, smart, and quick." },
                    { role: "user", content: text }
                ]
            })
        });

        const data = await response.json();
        if(data.error) {
            chat.innerHTML += `<div style="color:#ff3c7b;">[ERR]: ${data.error.message}</div>`;
            return;
        }

        const reply = data.choices[0].message.content;
        chat.innerHTML += `<div style="color:var(--gold); margin-bottom:8px;">[HEROVEE]: ${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speak(reply);
    } catch(e) {
        chat.innerHTML += `<div style="color:red;">[ERR]: Connection Failure</div>`;
    }
}

function startMic() {
    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'bn-BD';
    recognition.onstart = () => { document.getElementById('statusLab').innerText = "LISTENING"; };
    recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; askHEROVEE(); };
    recognition.onend = () => { document.getElementById('statusLab').innerText = "HEROVEE"; };
    recognition.start();
}

setInterval(() => { document.getElementById('cpu').innerText = Math.floor(Math.random()*15)+35; }, 4000);
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
