<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - Live Voice</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }

        /* স্ক্রিনশটের মতো ব্লু গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড এনিমেশন */
        .bg-gradient {
            position: absolute;
            bottom: -100px;
            left: 0;
            width: 100%;
            height: 400px;
            background: radial-gradient(circle at bottom, #2563eb 0%, transparent 70%);
            filter: blur(80px);
            animation: wave 4s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes wave {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(30px) scale(1.1); }
        }

        /* উপরের Live লেখা */
        .header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; font-size: 18px; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .live-dot { height: 8px; width: 8px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }

        /* মাঝখানের স্ট্যাটাস */
        .main-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; width: 80%; }
        #statusTxt { font-size: 20px; font-weight: 300; opacity: 0.8; }

        /* নিচের কন্ট্রোল বাটনগুলো */
        .footer-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 10; align-items: center; }
        .btn { background: #1e1e1e; border: none; border-radius: 50%; width: 55px; height: 55px; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn-end { background: #ef4444; width: 65px; height: 65px; font-size: 24px; }
        .btn:active { transform: scale(0.9); }
        .listening-active { background: #2563eb; box-shadow: 0 0 20px #2563eb; }
    </style>
</head>
<body>

<div class="header">
    <div class="live-dot"></div>
    <span>Live</span>
</div>

<div class="main-status">
    <div id="statusTxt">HEROVEE কানেক্ট হচ্ছে...</div>
</div>

<div class="bg-gradient"></div>

<div class="footer-controls">
    <button class="btn">📷</button>
    <button class="btn">📤</button>
    <button id="micBtn" class="btn" onclick="startCall()">🎤</button>
    <button class="btn btn-end" onclick="location.reload()">✕</button>
</div>

<script>
    const API_KEY = "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";
    const statusTxt = document.getElementById('statusTxt');
    const micBtn = document.getElementById('micBtn');

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'bn-BD';

    recognition.onstart = () => {
        micBtn.classList.add('listening-active');
        statusTxt.innerText = "আমি শুনছি... কথা বলুন";
    };

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        statusTxt.innerText = "আপনি বললেন: " + text;
        sendToAI(text);
    };

    function startCall() {
        recognition.start();
    }

    async function sendToAI(text) {
        statusTxt.innerText = "HEROVEE চিন্তা করছে...";
        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: text }] })
            });
            const data = await response.json();
            const aiMsg = data.choices[0].message.content;
            speak(aiMsg);
        } catch (e) {
            statusTxt.innerText = "কানেকশন এরর!";
        }
    }

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => v.lang.includes('bn') && (v.name.includes('Female') || v.name.includes('Google')));
        
        if (femaleVoice) utterance.voice = femaleVoice;
        utterance.lang = 'bn-BD';
        utterance.pitch = 1.2;
        
        utterance.onstart = () => { statusTxt.innerText = "HEROVEE কথা বলছে..."; };
        utterance.onend = () => { statusTxt.innerText = "আবার কথা বলতে মাইক চাপুন"; micBtn.classList.remove('listening-active'); };
        
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
