<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon-text: #ffffff; --bg-card: #121212; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: #fff; 
            font-family: 'Inter', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
        }

        .login-card { 
            background: var(--bg-card); 
            padding: 50px 35px; 
            border-radius: 35px; 
            text-align: center; 
            width: 85%; max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 40px;
            color: var(--neon-text);
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 15px; }

        input { 
            width: 100%; padding: 18px; 
            background: #1e1e1e; border: none; 
            color: #fff; border-radius: 20px; outline: none; 
            font-size: 14px; box-sizing: border-box;
            transition: 0.3s;
        }

        input::placeholder { color: #555; }

        .sign-in-btn { 
            width: 100%; 
            background: linear-gradient(90deg, #ff4081, #ffd54f); 
            color: #000; border: none; 
            padding: 18px; border-radius: 30px; 
            cursor: pointer; font-weight: 800; font-size: 15px;
            margin-top: 20px; text-transform: uppercase;
            transition: 0.3s;
        }

        .sign-in-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #777;
        }

        .footer-links span { cursor: pointer; transition: 0.2s; }
        .footer-links span:hover { color: #aaa; }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-text">HEROVEE</div>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Gmail Address" value="sadaf245sz@gmail.com">
        </div>
        
        <div class="input-group">
            <input type="password" id="pass" placeholder="Password">
        </div>

        <button class="sign-in-btn" onclick="login()">SIGN IN</button>

        <div class="footer-links">
            <span>Forget Password</span>
            <span>Create Account</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE", 
            authDomain: "herovee.firebaseapp.com", 
            projectId: "herovee", 
            storageBucket: "herovee.firebasestorage.app", 
            messagingSenderId: "700112828047", 
            appId: "1:700112828047:web:988f0598b5341a29bba2fa" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = () => {
            const email = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const btn = document.querySelector('.sign-in-btn');
            
            if(!p) return;
            btn.innerText = "VERIFYING...";

            signInWithEmailAndPassword(auth, email, p)
                .then(() => { 
                    window.location.href = "vault.html"; 
                })
                .catch(() => { 
                    alert("ACCESS DENIED!"); 
                    btn.innerText = "SIGN IN";
                });
        };
    </script>
</body>
</html>
