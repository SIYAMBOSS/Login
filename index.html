<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - OpenAI Tester</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        #response { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; min-height: 50px; text-align: left; font-size: 14px; white-space: pre-wrap; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>HEROVEE AI Test</h2>
    <input type="password" id="apiKey" placeholder="আপনার OpenAI API Key দিন" value="">
    <textarea id="userInput" rows="3" placeholder="এখানে কিছু লিখুন..."></textarea>
    <button onclick="askAI()">টেস্ট শুরু করুন</button>
    
    <div class="loader" id="loader"></div>
    <div id="response">রেসপন্স এখানে দেখা যাবে...</div>
</div>

<script>
    async function askAI() {
        const apiKey = document.getElementById('apiKey').value;
        const userInput = document.getElementById('userInput').value;
        const responseDiv = document.getElementById('response');
        const loader = document.getElementById('loader');

        if (!apiKey || !userInput) {
            alert("দয়া করে API Key এবং আপনার প্রশ্ন লিখুন!");
            return;
        }

        responseDiv.innerText = "লোডিং...";
        loader.style.display = "block";

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{ role: "user", content: userInput }]
                })
            });

            const data = await response.json();
            loader.style.display = "none";

            if (data.choices && data.choices[0]) {
                responseDiv.innerText = data.choices[0].message.content;
            } else {
                responseDiv.innerText = "ভুল হয়েছে: " + (data.error ? data.error.message : "অজানা সমস্যা");
            }
        } catch (error) {
            loader.style.display = "none";
            responseDiv.innerText = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
