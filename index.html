<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - ULTIMATE VISION 5.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #45f3ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* প্রিমিয়াম ব্যাকগ্রাউন্ড */
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #001a1a 0%, #000 70%); z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; background-image: linear-gradient(rgba(69, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(69, 243, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; transform: rotateX(60deg); top: -50%; left: -50%; animation: moveGrid 20s linear infinite; }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(40px); } }

        .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }

        /* আল্ট্রা প্রিমিয়াম কোর */
        .core-box { position: relative; width: 350px; height: 350px; display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r-outer { width: 100%; height: 100%; border-top: 3px solid #45f3ff; animation: spin 4s linear infinite; filter: drop-shadow(0 0 10px #45f3ff); }
        .r-mid { width: 85%; height: 85%; border-right: 2px solid #ffee00; animation: spinRev 6s linear infinite; }
        .r-inner { width: 70%; height: 70%; border-left: 2px solid #ff00ea; animation: spin 3s ease-in-out infinite; opacity: 0.6; }
        .r-dash { width: 115%; height: 115%; border: 1px dashed rgba(69, 243, 255, 0.2); animation: spinRev 15s linear infinite; }

        .center-sphere {
            width: 140px; height: 140px; background: radial-gradient(circle, #003333, #000);
            border-radius: 50%; border: 2px solid #45f3ff; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 40px rgba(69, 243, 255, 0.4), inset 0 0 20px rgba(0, 0, 0, 1);
            z-index: 10; transition: 0.4s;
        }
        .center-sphere.talking { box-shadow: 0 0 80px #ffee00; border-color: #ffee00; animation: breathe 1s infinite; }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .status-text { font-weight: bold; letter-spacing: 4px; font-size: 16px; text-shadow: 0 0 15px #45f3ff; color: #45f3ff; }

        /* সাইড HUD */
        .hud { position: absolute; padding: 12px; background: rgba(0, 255, 255, 0.05); border: 1px solid rgba(69, 243, 255, 0.2); font-size: 11px; width: 140px; backdrop-filter: blur(5px); }
        .hud-l { top: 30px; left: 30px; border-left: 4px solid #45f3ff; }
        .hud-r { top: 30px; right: 30px; border-right: 4px solid #ffee00; text-align: right; }

        /* চ্যাট বক্স */
        #chatDisplay { width: 90%; max-width: 450px; height: 150px; margin-top: 40px; overflow-y: auto; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(69, 243, 255, 0.2); padding: 15px; font-size: 13px; border-radius: 10px; scrollbar-width: none; }

        /* কন্ট্রোল */
        .input-group { margin-top: 25px; display: flex; gap: 10px; width: 90%; max-width: 450px; }
        input { flex: 1; background: transparent; border: 1px solid rgba(69, 243, 255, 0.4); color: #fff; padding: 12px; border-radius: 5px; outline: none; }
        .btn-exe { background: #45f3ff; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-mic { background: #ffee00; color: #000; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="bg-overlay"></div>
<div class="grid"></div>

<div class="main-container">
    <div class="hud hud-l">> NODE: ONLINE<br>> CPU: <span id="cpu">42</span>%<br>> BOSS: SIYAM</div>
    <div class="hud hud-r">> SECURE: AES-256<br>> LATENCY: 12ms<br>> VISION: 5.0</div>

    <div class="core-box">
        <div class="ring r-dash"></div>
        <div class="ring r-outer"></div>
        <div class="ring r-mid"></div>
        <div class="ring r-inner"></div>
        <div class="center-sphere" id="mainSphere">
            <span class="status-text" id="statusLabel">HEROVEE</span>
        </div>
    </div>

    <div id="chatDisplay">[SYSTEM] All systems nominal. Ready, Boss Siyam.</div>

    <div class="input-group">
        <button class="btn-mic" onclick="startVoice()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="Command HEROVEE..." onkeypress="if(event.key === 'Enter') executeAI()">
        <button class="btn-exe" onclick="executeAI()">EXECUTE</button>
    </div>
</div>

<script>
const KEY = "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";

function speakNow(msg) {
    const synth = window.speechSynthesis;
    const utter = new SpeechSynthesisUtterance(msg);
    const sphere = document.getElementById('mainSphere');
    const label = document.getElementById('statusLabel');

    utter.onstart = () => { sphere.classList.add('talking'); label.innerText = "ACTIVE"; };
    utter.onend = () => { sphere.classList.remove('talking'); label.innerText = "HEROVEE"; };

    utter.lang = /[\u0980-\u09FF]/.test(msg) ? 'bn-BD' : 'en-US';
    utter.pitch = 1.2;
    synth.speak(utter);
}

async function executeAI() {
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chatDisplay');
    const val = input.value.trim();
    if(!val) return;

    chat.innerHTML += `<div style="color: #fff; margin-top:5px;">[BOSS]: ${val}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [{ role: "system", content: "You are HEROVEE, a high-tech AI for Siyam Boss. Be concise and professional." }, { role: "user", content: val }]
            })
        });

        const data = await response.json();
        if(data.error) {
            chat.innerHTML += `<div style="color:red">[ERR]: ${data.error.message}</div>`;
            return;
        }

        const reply = data.choices[0].message.content;
        chat.innerHTML += `<div style="color:#ffee00; margin-top:5px;">[HEROVEE]: ${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speakNow(reply);
    } catch(e) {
        chat.innerHTML += `<div style="color:red">[ERR]: Connection Timeout</div>`;
    }
}

function startVoice() {
    const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    rec.lang = 'bn-BD';
    rec.onstart = () => document.getElementById('statusLabel').innerText = "LISTENING";
    rec.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; executeAI(); };
    rec.onend = () => document.getElementById('statusLabel').innerText = "HEROVEE";
    rec.start();
}

setInterval(() => { document.getElementById('cpu').innerText = Math.floor(Math.random()*20)+30; }, 4000);
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>
</body>
</html>
