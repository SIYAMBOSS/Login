<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE AI - NEW API MODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .ai-container { width: 95%; max-width: 450px; background: #0a0a0a; padding: 25px; border-radius: 30px; border: 1px solid #45f3ff33; box-shadow: 0 0 40px #45f3ff10; text-align: center; }
        .status { font-size: 10px; color: #45f3ff; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; opacity: 0.8; }
        #aiChatBox { height: 380px; overflow-y: auto; background: #050505; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: left; font-size: 15px; border: 1px solid #1a1a1a; scroll-behavior: smooth; }
        .user-msg { color: #fff; margin-bottom: 12px; background: #1a1a1a; padding: 10px 15px; border-radius: 18px 18px 0 18px; align-self: flex-end; border-right: 3px solid #45f3ff; }
        .ai-msg { color: #ffee00; margin-bottom: 12px; background: #1a1a1a; padding: 10px 15px; border-radius: 18px 18px 18px 0; border-left: 3px solid #ffee00; }
        .input-area { display: flex; gap: 12px; align-items: center; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 14px 20px; border-radius: 50px; outline: none; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: #45f3ff; background: #1a1a1a; }
        button { background: #45f3ff; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; color: #000; transition: 0.3s; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        button:hover { transform: scale(1.1); box-shadow: 0 0 15px #45f3ff; }
        .mic-btn { background: #ffee00; }
        .mic-btn.listening { background: #ff3c7b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 60, 123, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 60, 123, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 60, 123, 0); } }
    </style>
</head>
<body>

<div class="ai-container">
    <div class="status">HEROVEE AI • API UPDATED • BOSS: SIYAM</div>
    <div id="aiChatBox">
        <div class="ai-msg">হ্যালো সিয়াম বস্! নতুন এপিআই কানেক্টেড। আমি আপনার জন্য কী করতে পারি?</div>
    </div>
    
    <div class="input-area">
        <button id="micBtn" class="mic-btn" onclick="startListening()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="aiInput" placeholder="HEROVEE-এর সাথে কথা বলুন..." onkeypress="if(event.key === 'Enter') askAI()">
        <button onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
// নতুন Groq API Key আপডেট করা হয়েছে
const GROQ_API_KEY = "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";

function speak(text) {
    const synth = window.speechSynthesis;
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = synth.getVoices();
    const isBengali = /[\u0980-\u09FF]/.test(text);
    
    if (isBengali) {
        const bnVoice = voices.find(v => v.lang.includes('bn') || v.name.includes('Bangladesh') || v.name.includes('India'));
        if (bnVoice) utterance.voice = bnVoice;
        utterance.lang = 'bn-BD';
    } else {
        const enVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google UK English Female') || v.name.includes('Zira'));
        if (enVoice) utterance.voice = enVoice;
        utterance.lang = 'en-US';
    }
    
    utterance.pitch = 1.3;
    utterance.rate = 1.0;
    synth.speak(utterance);
}

async function askAI() {
    const inputField = document.getElementById('aiInput');
    const userInput = inputField.value.trim();
    if (!userInput) return;

    const chatBox = document.getElementById('aiChatBox');
    chatBox.innerHTML += `<div class="user-msg"><b>Boss:</b> ${userInput}</div>`;
    inputField.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${GROQ_API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [
                    { 
                        role: "system", 
                        content: "You are HEROVEE, a beautiful and smart female AI assistant. Your boss is Siyam. Speak in Bengali or English based on his choice. Keep responses charming and helpful." 
                    },
                    { role: "user", content: userInput }
                ]
            })
        });

        const data = await response.json();
        const aiMsg = data.choices[0].message.content;
        
        chatBox.innerHTML += `<div class="ai-msg"><b>HEROVEE:</b> ${aiMsg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        speak(aiMsg);

    } catch (error) {
        chatBox.innerHTML += `<div style="color: #ff3c7b;">Error: API কানেকশনে সমস্যা হচ্ছে বস্!</div>`;
    }
}

function startListening() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    const micBtn = document.getElementById('micBtn');
    recognition.lang = 'bn-BD'; 

    recognition.onstart = () => {
        micBtn.classList.add('listening');
        document.getElementById('aiInput').placeholder = "শুনছি বস্...";
    };

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('aiInput').value = transcript;
        micBtn.classList.remove('listening');
        askAI();
    };

    recognition.onerror = () => {
        micBtn.classList.remove('listening');
        document.getElementById('aiInput').placeholder = "আবার চেষ্টা করুন...";
    };

    recognition.onend = () => micBtn.classList.remove('listening');
    recognition.start();
}

window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
</script>

</body>
</html>
