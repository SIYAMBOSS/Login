<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - ULTRA VISION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #45f3ff; font-family: 'Consolas', monospace; overflow: hidden; }
        
        /* ব্যাকগ্রাউন্ড স্ক্যান লাইন */
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 255, 0.2); position: absolute; top: 0; left: 0; z-index: 10; animation: scan 4s linear infinite; box-shadow: 0 0 15px #45f3ff; }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        .main-interface { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; z-index: 5; }

        /* আল্ট্রা কোর এনিমেশন */
        .core-container { position: relative; width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; }
        .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(69, 243, 255, 0.2); }
        .outer-ring { width: 100%; height: 100%; border-top: 3px solid #45f3ff; animation: spin 5s linear infinite; }
        .inner-ring { width: 80%; height: 80%; border-right: 3px solid #ffee00; animation: spinRev 3s linear infinite; opacity: 0.6; }
        
        .core-circle { width: 130px; height: 130px; background: radial-gradient(circle, rgba(69, 243, 255, 0.2), #000); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #45f3ff; box-shadow: 0 0 30px rgba(69, 243, 255, 0.5); position: relative; transition: 0.5s; }
        
        /* কথা বলার সময় পালসিং এফেক্ট */
        .core-circle.talking { animation: pulseGlow 1s ease-in-out infinite; border-color: #ffee00; box-shadow: 0 0 60px rgba(255, 238, 0, 0.6); }
        @keyframes pulseGlow { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* স্ট্যাটাস প্যানেল */
        .stats { position: absolute; padding: 15px; background: rgba(0, 255, 255, 0.03); border: 1px solid rgba(69, 243, 255, 0.1); font-size: 11px; width: 140px; }
        .stats-left { top: 30px; left: 30px; border-left: 4px solid #45f3ff; }
        .stats-right { top: 30px; right: 30px; border-right: 4px solid #ffee00; text-align: right; }

        /* চ্যাট বক্স */
        #aiChatBox { width: 90%; max-width: 420px; height: 150px; margin-top: 40px; overflow-y: auto; background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(69, 243, 255, 0.2); padding: 15px; font-size: 13px; color: #45f3ff; box-shadow: inset 0 0 10px rgba(69, 243, 255, 0.1); }
        
        /* কন্ট্রোল প্যানেল */
        .controls { margin-top: 25px; display: flex; gap: 12px; width: 90%; max-width: 420px; }
        input { flex: 1; background: transparent; border: 1px solid rgba(69, 243, 255, 0.4); color: #45f3ff; padding: 12px; outline: none; font-family: 'Consolas', monospace; }
        .btn { background: transparent; border: 1px solid #45f3ff; color: #45f3ff; padding: 10px 18px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #45f3ff; color: #000; box-shadow: 0 0 15px #45f3ff; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="main-interface">
    <div class="stats stats-left">
        > SYSTEM: ONLINE<br>
        > CPU: <span id="cpuLoad">42</span>%<br>
        > TEMP: <span id="tempVal">38</span>°C<br>
        > BOSS: SIYAM
    </div>
    <div class="stats stats-right">
        > MEMORY: <span id="memLoad">2.4</span>GB<br>
        > SIGNAL: STABLE<br>
        > UPTIME: <span id="uptime">00:00</span>
    </div>

    <div class="core-container">
        <div class="ring outer-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="core-circle" id="core">
            <span id="statusLabel" style="font-weight: bold; letter-spacing: 3px;">HEROVEE</span>
        </div>
    </div>

    <div id="aiChatBox">
        [SYS] Initializing HEROVEE Vision...<br>
        [SYS] Boss Siyam, I am ready for your command.
    </div>

    <div class="controls">
        <button class="btn" onclick="startListening()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="aiInput" placeholder="CMD_INPUT..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn" onclick="askAI()">EXEC</button>
    </div>
</div>

<script>
// নতুন API Key অবশ্যই এখানে আপডেট করে নিন বস্
const API_KEY = "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";

// রিয়েল-টাইম ডামি ডাটা আপডেট (এনিমেশন ফিল দেওয়ার জন্য)
setInterval(() => {
    document.getElementById('cpuLoad').innerText = Math.floor(Math.random() * 20) + 30;
    document.getElementById('tempVal').innerText = Math.floor(Math.random() * 5) + 35;
    document.getElementById('memLoad').innerText = (Math.random() * (2.8 - 2.1) + 2.1).toFixed(1);
}, 2000);

function speak(text) {
    const synth = window.speechSynthesis;
    const utterance = new SpeechSynthesisUtterance(text);
    const core = document.getElementById('core');
    const label = document.getElementById('statusLabel');

    utterance.onstart = () => { 
        core.classList.add('talking'); 
        label.innerText = "SPEAKING";
    };
    utterance.onend = () => { 
        core.classList.remove('talking'); 
        label.innerText = "HEROVEE";
    };

    utterance.pitch = 1.3;
    synth.speak(utterance);
}

async function askAI() {
    const input = document.getElementById('aiInput');
    const chat = document.getElementById('aiChatBox');
    const text = input.value.trim();
    if (!text) return;

    chat.innerHTML += `<div>[BOSS]: ${text}</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3-8b-8192",
                messages: [{ role: "system", content: "You are HEROVEE, a high-tech AI for Siyam Boss. Be loyal and smart." }, { role: "user", content: text }]
            })
        });
        const data = await res.json();
        const aiMsg = data.choices[0].message.content;
        chat.innerHTML += `<div style="color:#ffee00">[HEROVEE]: ${aiMsg}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speak(aiMsg);
    } catch (e) { chat.innerHTML += `<div style="color:red">[ERR]: CONNECTION_FAILED</div>`; }
}

function startListening() {
    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'bn-BD';
    recognition.onstart = () => { document.getElementById('statusLabel').innerText = "LISTENING"; };
    recognition.onresult = (e) => { document.getElementById('aiInput').value = e.results[0][0].transcript; askAI(); };
    recognition.onend = () => { document.getElementById('statusLabel').innerText = "HEROVEE"; };
    recognition.start();
}
</script>
</body>
</html>
