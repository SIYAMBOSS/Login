<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - 11 KEYS EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap');
        :root { --neon: #45f3ff; --pink: #ff3c7b; --gold: #ffee00; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        .bg-container { position: fixed; width: 100%; height: 100%; perspective: 1000px; z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(var(--neon) 1px, transparent 1px), linear-gradient(90deg, var(--neon) 1px, transparent 1px); background-size: 60px 60px; transform: rotateX(60deg); opacity: 0.05; animation: moveGrid 15s linear infinite; }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(60px); } }
        .main-ui { display: flex; flex-direction: column; align-items: center; height: 100vh; padding-top: 50px; }
        .core-box { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .ring { position: absolute; border-radius: 50%; border: 5px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top-color: var(--neon); animation: spin 4s linear infinite; box-shadow: 0 0 15px var(--neon); }
        .r2 { width: 85%; height: 85%; border-bottom-color: var(--pink); animation: spinRev 6s linear infinite; }
        .center-orb { width: 110px; height: 110px; background: radial-gradient(circle, #002222, #000); border-radius: 50%; border: 1px solid var(--neon); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
        .speaking-anim { animation: pulse 0.4s infinite alternate; box-shadow: 0 0 50px var(--neon); }
        .orb-text { color: #fff; text-shadow: 0 0 8px var(--neon); text-transform: uppercase; font-size: 10px; font-weight: 900; }
        #chatDisplay { width: 90%; max-width: 450px; height: 180px; background: rgba(5, 5, 5, 0.9); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; font-size: 13px; font-family: 'Inter'; overflow-y: auto; color: #fff; margin-bottom: 20px; scrollbar-width: none; }
        .controls { width: 92%; max-width: 450px; display: flex; gap: 10px; }
        input { flex: 1; background: #080808; border: 1px solid #222; color: #fff; padding: 15px; border-radius: 12px; outline: none; }
        .btn { background: var(--neon); border: none; padding: 15px; border-radius: 12px; cursor: pointer; color: #000; font-weight: bold; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>
<div class="bg-container"><div class="grid"></div></div>
<div class="main-ui">
    <div class="core-box">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb"><span class="orb-text">The</span><span class="orb-text">Poor Squad</span></div>
    </div>
    <div id="chatDisplay"></div>
    <div class="controls">
        <button class="btn" onclick="startVoice()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="বস্, কিছু বলুন..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn" style="background:var(--gold)" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // আপনার ১১টি Groq Keys (Rotation System)
    const GROQ_KEYS = [
        "gsk_L0m4NS6j5tMR9uB1vH7E3p0r4N7V8W2QXmK1p9oZ3LWGdyb3FY"
         
    ];

    let currentKeyIndex = 0;
    const orb = document.getElementById('orb');
    const chatDisplay = document.getElementById('chatDisplay');

    // নরমাল ব্রাউজার ভয়েস (ফ্রি)
    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        const voices = synth.getVoices();
        
        // মেয়েদের মিষ্টি ভয়েস সেট করা
        const femaleVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Female'));
        if (femaleVoice) utter.voice = femaleVoice;
        
        utter.lang = 'bn-BD';
        utter.pitch = 1.3;
        utter.rate = 1.0;
        
        utter.onstart = () => orb.classList.add('speaking-anim');
        utter.onend = () => orb.classList.remove('speaking-anim');
        
        synth.speak(utter);
    }

    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        chatDisplay.innerHTML += `<div style="color:var(--neon); margin-bottom:10px;"><b>বস্:</b> ${text}</div>`;
        input.value = "";
        orb.innerText = "WAIT";

        let success = false;
        while (!success && currentKeyIndex < GROQ_KEYS.length) {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${GROQ_KEYS[currentKeyIndex]}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "আপনি HEROVEE, সিয়াম বসের মায়াবী মেয়ে বন্ধু। আপনি অত্যন্ত সংক্ষেপে ১-২ বাক্যে কথা বলেন।" },
                            { role: "user", content: text }
                        ]
                    })
                });

                if (res.status === 429) { // লিমিট শেষ হলে পরের কী ধরবে
                    currentKeyIndex++;
                    continue;
                }

                const data = await res.json();
                const reply = data.choices[0].message.content;
                chatDisplay.innerHTML += `<div style="color:var(--gold); margin-bottom:15px;"><b>HEROVEE:</b> ${reply}</div>`;
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
                orb.innerHTML = `<span class="orb-text">The</span><span class="orb-text">Poor Squad</span>`;
                speak(reply);
                success = true;
            } catch (e) {
                currentKeyIndex++;
            }
        }
        if(!success) orb.innerText = "KEY ERROR";
    }

    function startVoice() {
        const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        rec.lang = 'bn-BD';
        rec.onresult = (e) => {
            document.getElementById('userInput').value = e.results[0][0].transcript;
            askAI();
        };
        rec.start();
    }

    window.speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
