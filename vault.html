<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - VOICE CORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --gold: #ffee00; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; transition: 0.5s; }
        
        /* Full Screen Voice Mode Logic */
        .voice-mode-active .top-nav, 
        .voice-mode-active #chatDisplay, 
        .voice-mode-active .controls { 
            opacity: 0; pointer-events: none; transform: translateY(20px); 
        }

        .core-box { 
            position: relative; width: 220px; height: 220px; 
            display: flex; justify-content: center; align-items: center; 
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        /* অর্ব বড় করার লজিক */
        .voice-mode-active .core-box { transform: scale(1.8); }

        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 3px solid var(--neon); animation: spin 3s linear infinite; }
        .r2 { width: 85%; height: 85%; border-bottom: 2px solid var(--gold); animation: spinRev 5s linear infinite; }
        
        .center-orb { 
            width: 100px; height: 100px; 
            background: radial-gradient(circle, #004444, #000); 
            border-radius: 50%; border: 1px solid var(--neon); 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.3);
            font-size: 10px; cursor: pointer; transition: 0.5s;
        }

        /* কথা বলার সময় লাইভ এনিমেশন */
        .speaking-anim { 
            animation: liveVoice 0.4s infinite alternate !important; 
            box-shadow: 0 0 50px var(--neon), inset 0 0 20px var(--neon) !important;
            background: radial-gradient(circle, var(--neon), #000) !important;
        }

        @keyframes liveVoice {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.15); opacity: 1; }
        }

        /* UI Elements Styling */
        #chatDisplay { width: 90%; max-width: 480px; height: 180px; margin-top: 30px; background: rgba(0,10,10,0.8); border: 1px solid rgba(69,243,255,0.1); border-radius: 20px; padding: 15px; font-size: 12px; overflow-y: auto; scrollbar-width: none; transition: 0.5s; }
        .controls { margin-top: 20px; display: flex; gap: 10px; width: 90%; max-width: 480px; transition: 0.5s; }
        input { flex: 1; background: #080808; border: 1px solid #222; color: #fff; padding: 15px; border-radius: 12px; outline: none; }
        .mic-btn { background: none; border: 1px solid var(--neon); color: var(--neon); padding: 15px; border-radius: 12px; cursor: pointer; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="main-ui" id="mainUI">
    <div class="top-nav" style="position:absolute; top:5%;">
        <button onclick="location.href='index.html'" style="background:none; border:1px solid red; color:red; padding:5px 15px; border-radius:20px; font-size:10px; cursor:pointer;">LOGOUT</button>
    </div>

    <div class="core-box" id="coreContainer">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb" onclick="toggleVoiceMode()">HEROVEE</div>
    </div>

    <div id="chatDisplay"></div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Type command...">
        <button class="mic-btn" onclick="toggleVoiceMode()"><i class="fas fa-microphone"></i></button>
    </div>
</div>

<script>
    const orb = document.getElementById('orb');
    const mainUI = document.getElementById('mainUI');
    const chatDisplay = document.getElementById('chatDisplay');

    function toggleVoiceMode() {
        // Voice Mode Active
        mainUI.classList.add('voice-mode-active');
        orb.innerText = "LISTENING";
        
        const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        recognition.lang = 'bn-BD';

        recognition.onstart = () => {
            orb.classList.add('speaking-anim'); // এনিমেশন শুরু
        };

        recognition.onresult = async (event) => {
            const command = event.results[0][0].transcript;
            orb.innerText = "THINKING";
            
            // এখানে আপনার Groq API কল হবে (আগের কোডের মতো)
            // উদাহরণের জন্য ১ সেকেন্ড ওয়েট করছি
            setTimeout(() => {
                const reply = "Bosh, ami apnar kotha shunte peyechi. Apni bollen: " + command;
                speak(reply);
            }, 1000);
        };

        recognition.onend = () => {
            // কথা বলা শেষ হলে আবার নরমাল মোডে ফিরবে (কিছুক্ষণ পর)
        };

        recognition.start();
    }

    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'bn-BD';

        utter.onstart = () => {
            orb.innerText = "SPEAKING";
            orb.classList.add('speaking-anim');
        };

        utter.onend = () => {
            orb.classList.remove('speaking-anim');
            orb.innerText = "HEROVEE";
            // ৩ সেকেন্ড পর আবার সব লেখা ফিরিয়ে আনা
            setTimeout(() => {
                mainUI.classList.remove('voice-mode-active');
            }, 2000);
        };

        synth.speak(utter);
    }
</script>

</body>
</html>
