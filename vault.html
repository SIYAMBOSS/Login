<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - Emotional Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap');
        
        :root { --neon: #45f3ff; --gold: #ffee00; --pink: #ff3c7b; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        /* Background Grid */
        .bg-container { position: fixed; width: 100%; height: 100%; perspective: 1000px; z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(var(--neon) 1px, transparent 1px), linear-gradient(90deg, var(--neon) 1px, transparent 1px); background-size: 60px 60px; transform: rotateX(60deg); opacity: 0.05; }

        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; position: relative; padding-top: 50px; }
        
        /* The Poor Squad Core Orbit */
        .core-box { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; z-index: 10; margin-bottom: 30px; }
        .ring { position: absolute; border-radius: 50%; border: 4px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top-color: var(--neon); animation: spin 4s linear infinite; box-shadow: 0 0 15px var(--neon); }
        .r2 { width: 85%; height: 85%; border-bottom-color: var(--pink); animation: spinRev 6s linear infinite; }
        
        .center-orb { width: 110px; height: 110px; background: radial-gradient(circle, #001a1a, #000); border-radius: 50%; border: 1px solid var(--neon); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: 0.5s; text-align: center; }
        .speaking-anim { animation: pulse 0.4s infinite alternate; box-shadow: 0 0 50px var(--neon); }

        .orb-text { color: #fff; text-shadow: 0 0 8px var(--neon); text-transform: uppercase; font-size: 10px; font-weight: 900; }
        
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }

        /* Chat UI */
        #chatDisplay { width: 90%; max-width: 450px; height: 180px; background: rgba(10, 10, 10, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; font-size: 13px; font-family: 'Inter'; overflow-y: auto; color: #fff; margin-bottom: 20px; }
        .controls { width: 92%; max-width: 450px; display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 15px; outline: none; font-family: 'Inter'; }
        .btn { background: var(--neon); color: #000; border: none; padding: 15px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="bg-container"><div class="grid"></div></div>
<div class="main-ui">
    <div class="core-box">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb">
            <span class="orb-text">The</span>
            <span class="orb-text">Poor Squad</span>
        </div>
    </div>

    <div id="chatDisplay"></div>

    <div class="controls">
        <button class="btn" onclick="startVoice()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="বস্, কিছু লিখুন..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn" style="background:var(--gold)" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    // Firebase এবং API Key আপনার আগের কোড থেকে থাকবে
    const API_KEY = "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";
    const orb = document.getElementById('orb');
    const chatDisplay = document.getElementById('chatDisplay');

    // গার্লস ভয়েস লজিক (মেয়েদের মিষ্টি কন্ঠস্বর)
    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        
        // মেয়েদের কন্ঠস্বর খোঁজা (Google US English বা Samantha সাধারণত মিষ্টি হয়)
        const voices = synth.getVoices();
        const girlVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Samantha'));
        
        if (girlVoice) utter.voice = girlVoice;
        utter.lang = 'bn-BD'; 
        utter.pitch = 1.3; // কন্ঠস্বরকে আরও মেয়েলি এবং মিষ্টি করার জন্য পিচ বাড়ানো হয়েছে
        utter.rate = 1.0;  // কথা বলার গতি স্বাভাবিক
        
        utter.onstart = () => orb.classList.add('speaking-anim');
        utter.onend = () => orb.classList.remove('speaking-anim');
        
        synth.speak(utter);
    }

    window.askAI = async () => {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;
        
        chatDisplay.innerHTML += `<div style="color:var(--neon)"><b>সিয়াম:</b> ${text}</div>`;
        input.value = "";

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "আপনি HEROVEE, সিয়াম বসের অত্যন্ত মায়াবী এবং অনুগত মেয়ে বন্ধু। আপনি তাকে কোডিং এবং সব কাজে মিষ্টি কন্ঠে সাহায্য করেন।" },
                        { role: "user", content: text }
                    ]
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatDisplay.innerHTML += `<div style="color:var(--gold)"><b>HEROVEE:</b> ${reply}</div>`;
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            speak(reply);
        } catch (e) {
            console.error(e);
        }
    };

    window.startVoice = () => {
        const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        rec.lang = 'bn-BD';
        rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            window.askAI();
        };
        rec.start();
    };

    // ভয়েস লোড হওয়ার জন্য একটু সময় দিতে হয়
    window.speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
