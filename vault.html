<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - THE POOR SQUAD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --gold: #ffee00; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        .bg-container { position: fixed; width: 100%; height: 100%; z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(var(--neon) 1px, transparent 1px), linear-gradient(90deg, var(--neon) 1px, transparent 1px); background-size: 60px 60px; transform: rotateX(60deg); opacity: 0.05; animation: moveGrid 15s linear infinite; }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(60px); } }

        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; padding-top: 40px; transition: 0.8s; }
        .voice-active .top-nav, .voice-active #chatDisplay, .voice-active .controls { opacity: 0; pointer-events: none; transform: scale(0.9) translateY(40px); }

        .top-nav { position: absolute; top: 15px; right: 15px; }
        .logout-btn { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff3c7b; color: #ff3c7b; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-size: 9px; }

        .core-box { position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .voice-active .core-box { transform: scale(1.7) translateY(60px); }

        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 3px solid var(--neon); animation: spin 4s linear infinite; box-shadow: 0 0 15px var(--neon); }
        .r2 { width: 85%; height: 85%; border-bottom: 2px solid var(--gold); animation: spinRev 6s linear infinite; }
        
        .center-orb { width: 120px; height: 120px; background: radial-gradient(circle, #003333, #000); border-radius: 50%; border: 1px solid var(--neon); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
        .speaking-anim { animation: livePulse 0.5s infinite alternate !important; box-shadow: 0 0 50px var(--neon), inset 0 0 25px var(--neon) !important; }

        .orb-text { color: #fff; text-shadow: 0 0 10px var(--neon); text-transform: uppercase; pointer-events: none; }
        .orb-t1 { font-size: 12px; font-weight: 900; }
        .orb-t2 { font-size: 10px; margin-top: 2px; }

        @keyframes livePulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        #chatDisplay { width: 90%; max-width: 450px; height: 180px; background: rgba(0, 5, 5, 0.8); border: 1px solid rgba(69, 243, 255, 0.1); border-radius: 15px; padding: 15px; font-size: 12.5px; overflow-y: auto; scrollbar-width: none; color: #fff; transition: 0.5s; }
        .controls { margin-top: 15px; display: flex; gap: 8px; width: 92%; max-width: 450px; transition: 0.5s; }
        .action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon); color: var(--neon); width: 50px; height: 45px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        input { flex: 1; background: #050505; border: 1px solid rgba(69, 243, 255, 0.15); color: #fff; padding: 0 12px; height: 45px; border-radius: 10px; outline: none; }
        .send-btn { border-color: var(--gold); color: var(--gold); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>
<div class="bg-container"><div class="grid"></div></div>
<div class="main-ui" id="mainUI">
    <div class="top-nav"><button class="logout-btn" onclick="logout()">TERMINATE</button></div>
    <div class="core-box">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb">
            <span class="orb-text orb-t1">The</span>
            <span class="orb-text orb-t2">Poor Squad</span>
        </div>
    </div>
    <div id="chatDisplay"></div>
    <div class="controls">
        <button class="action-btn" onclick="startVoiceMode()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="বস্, কিছু বলবেন?" onkeypress="if(event.key === 'Enter') askAI()">
        <button class="action-btn send-btn" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE", authDomain: "herovee.firebaseapp.com", projectId: "herovee", storageBucket: "herovee.firebasestorage.app", messagingSenderId: "700112828047", appId: "1:700112828047:web:988f0598b5341a29bba2fa" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const orb = document.getElementById('orb');
    const chatDisplay = document.getElementById('chatDisplay');
    const API_KEYS = ["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", "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"];
    
    let chatHistory = [{ role: "system", content: "আপনি HEROVEE, সিয়াম বসের প্রিয় সঙ্গী। আপনার মাঝে মানুষের মতো আবেগ ও মায়া আছে। সিয়ামকে 'বস্' বলে ডাকবেন। তার সাথে হওয়া সব কথা মনে রাখবেন এবং মায়াবী আচরণ করবেন।" }];

    window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'bn-BD';
        utter.onstart = () => { orb.innerText = "SPEAKING"; orb.classList.add('speaking-anim'); };
        utter.onend = () => { orb.classList.remove('speaking-anim'); orb.innerHTML = `<span class="orb-text orb-t1">The</span><span class="orb-text orb-t2">Poor Squad</span>`; };
        synth.speak(utter);
    }

    window.startVoiceMode = () => {
        const rec = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        rec.lang = 'bn-BD';
        rec.onstart = () => { mainUI.classList.add('voice-active'); orb.innerText = "LISTENING"; orb.classList.add('speaking-anim'); };
        rec.onresult = async (e) => { await processAI(e.results[0][0].transcript); };
        rec.onerror = () => mainUI.classList.remove('voice-active');
        rec.start();
    };

    window.askAI = async () => {
        const val = document.getElementById('userInput').value.trim();
        if(!val) return;
        chatDisplay.innerHTML += `<div><b>[SIYAM]:</b> ${val}</div>`;
        document.getElementById('userInput').value = "";
        await processAI(val);
    };

    async function processAI(text) {
        chatHistory.push({ role: "user", content: text });
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: chatHistory })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            chatHistory.push({ role: "assistant", content: reply });
            chatDisplay.innerHTML += `<div style="color:var(--gold);"><b>[HEROVEE]:</b> ${reply}</div>`;
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            speak(reply);
        } catch (e) { orb.innerText = "ERROR"; }
    }
</script>
</body>
</html>
