<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - LIVE ACCESS 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --gold: #ffee00; --pink: #ff00ea; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        /* Cyberpunk Background */
        .bg-container { position: fixed; width: 100%; height: 100%; perspective: 1000px; z-index: -1; }
        .grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(var(--neon) 1px, transparent 1px), linear-gradient(90deg, var(--neon) 1px, transparent 1px); background-size: 60px 60px; transform: rotateX(60deg); opacity: 0.1; animation: moveGrid 10s linear infinite; }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0); } 100% { transform: rotateX(60deg) translateY(60px); } }

        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }

        /* Logout Top Center */
        .top-nav { position: absolute; top: 8%; z-index: 100; text-align: center; }
        .logout-btn { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff3c7b; color: #ff3c7b; padding: 8px 25px; border-radius: 50px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; }
        .logout-btn:hover { background: #ff3c7b; color: #000; box-shadow: 0 0 20px #ff3c7b; }
        .live-tag { font-size: 9px; color: var(--gold); margin-top: 8px; letter-spacing: 1px; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* AI Core Orbit */
        .core-box { position: relative; width: 240px; height: 240px; display: flex; justify-content: center; align-items: center; margin-top: 15px; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 3px solid var(--neon); animation: spin 3s linear infinite; box-shadow: 0 0 15px var(--neon); }
        .r2 { width: 80%; height: 80%; border-bottom: 2px solid var(--gold); animation: spinRev 5s linear infinite; }
        .center-orb { width: 90px; height: 90px; background: radial-gradient(circle, #003333, #000); border-radius: 50%; border: 1px solid var(--neon); display: flex; justify-content: center; align-items: center; z-index: 10; font-size: 11px; color: #fff; text-shadow: 0 0 10px var(--neon); }
        .center-orb.active { animation: pulse 0.4s infinite alternate; border-color: var(--gold); box-shadow: 0 0 30px var(--gold); }

        /* Chat Display */
        #chatDisplay { width: 90%; max-width: 500px; height: 250px; margin-top: 25px; overflow-y: auto; background: rgba(0, 5, 5, 0.9); border: 1px solid rgba(69, 243, 255, 0.2); border-radius: 20px; padding: 20px; font-size: 13px; font-family: 'Inter', sans-serif; scrollbar-width: none; line-height: 1.6; }
        #chatDisplay div { margin-bottom: 15px; }

        /* Input Controls */
        .controls { margin-top: 20px; display: flex; gap: 12px; width: 90%; max-width: 500px; }
        input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(69, 243, 255, 0.3); color: #fff; padding: 15px 20px; outline: none; border-radius: 15px; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: var(--neon); background: rgba(255, 255, 255, 0.1); }
        .btn-exe { background: var(--neon); color: #000; border: none; padding: 0 25px; font-weight: 900; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .btn-exe:hover { background: var(--gold); box-shadow: 0 0 15px var(--gold); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>
<div class="bg-container"><div class="grid"></div></div>
<div class="main-ui">
    <div class="top-nav">
        <button class="logout-btn" id="logoutBtn">Logout System</button>
        <div class="live-tag"><i class="fas fa-circle"></i> LIVE FEED: MARCH 11, 2026</div>
    </div>

    <div class="core-box">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb">HEROVEE</div>
    </div>

    <div id="chatDisplay"></div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Ask anything, Boss Siyam..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="btn-exe" onclick="askAI()"><i class="fas fa-bolt"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE",
        authDomain: "herovee.firebaseapp.com",
        projectId: "herovee",
        storageBucket: "herovee.firebasestorage.app",
        messagingSenderId: "700112828047",
        appId: "1:700112828047:web:988f0598b5341a29bba2fa"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "index.html"; });
    document.getElementById('logoutBtn').onclick = () => { signOut(auth).then(() => { localStorage.clear(); window.location.href = "index.html"; }); };

    const API_KEYS = ["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", "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", "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", "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", "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", "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", "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", "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", "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", "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", "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"];

    const chatDisplay = document.getElementById('chatDisplay');
    const orb = document.getElementById('orb');

    window.askAI = async () => {
        const input = document.getElementById('userInput');
        const val = input.value.trim();
        if(!val) return;
        
        chatDisplay.innerHTML += `<div style="color:var(--neon);"><b>[SIYAM]:</b> ${val}</div>`;
        input.value = "";
        orb.classList.add('active');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;

        // Current Date Tracking for 2026
        const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        async function tryRequest(idx) {
            if(idx >= API_KEYS.length) return "All API channels are saturated, Boss.";
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEYS[idx]}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: `You are HEROVEE, an ultra-advanced AI built by Siyam. Current date: ${today}. You have live web-access capabilities. Always provide answers in the context of 2026. Be concise and sharp.` },
                            { role: "user", content: val }
                        ],
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                if(res.status === 429) return await tryRequest(idx + 1);
                return data.choices[0].message.content;
            } catch { return await tryRequest(idx + 1); }
        }

        const reply = await tryRequest(0);
        orb.classList.remove('active');
        chatDisplay.innerHTML += `<div style="color:var(--gold);"><b>[HEROVEE]:</b> ${reply}</div>`;
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    };
</script>
</body>
</html>
