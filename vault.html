<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEROVEE - ULTIMATE CORE 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #45f3ff; --gold: #ffee00; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Orbitron', sans-serif; overflow: hidden; }
        
        /* UI Layout */
        .main-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; transition: 0.8s; }
        
        /* Full Screen Voice Isolation */
        .voice-active .top-nav, .voice-active #chatDisplay, .voice-active .controls { 
            opacity: 0; pointer-events: none; transform: scale(0.9);
        }

        /* The Orb Container */
        .core-box { 
            position: relative; width: 220px; height: 220px; 
            display: flex; justify-content: center; align-items: center; 
            transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .voice-active .core-box { transform: scale(1.6); }

        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
        .r1 { width: 100%; height: 100%; border-top: 3px solid var(--neon); animation: spin 3s linear infinite; }
        .r2 { width: 85%; height: 85%; border-bottom: 2px solid var(--gold); animation: spinRev 5s linear infinite; }
        
        .center-orb { 
            width: 100px; height: 100px; 
            background: radial-gradient(circle, #004444, #000); 
            border-radius: 50%; border: 1px solid var(--neon); 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.4);
            font-size: 10px; cursor: pointer; transition: 0.5s; text-align: center; padding: 5px;
        }

        /* Speaking Animation (Wave effect) */
        .speaking-anim { 
            animation: livePulse 0.5s infinite alternate !important; 
            box-shadow: 0 0 60px var(--neon), inset 0 0 30px var(--neon) !important;
        }

        @keyframes livePulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.1); filter: brightness(1.5); }
        }

        /* Interface Elements */
        #chatDisplay { width: 90%; max-width: 480px; height: 180px; margin-top: 30px; background: rgba(0,10,10,0.8); border: 1px solid rgba(69,243,255,0.1); border-radius: 20px; padding: 15px; font-size: 12px; overflow-y: auto; color: #fff; transition: 0.5s; font-family: 'Inter'; }

        .controls { margin-top: 20px; display: flex; gap: 8px; width: 92%; max-width: 480px; transition: 0.5s; }
        input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 12px; outline: none; }
        .action-btn { background: none; border: 1px solid var(--neon); color: var(--neon); width: 50px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .action-btn:hover { background: var(--neon); color: #000; }
        .send-btn { border-color: var(--gold); color: var(--gold); }
        .send-btn:hover { background: var(--gold); color: #000; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

<div class="main-ui" id="mainUI">
    <div class="top-nav" style="position:absolute; top:5%;">
        <button onclick="logout()" style="background:none; border:1px solid red; color:red; padding:6px 20px; border-radius:50px; font-size:10px; cursor:pointer; font-weight: bold;">TERMINATE SESSION</button>
    </div>

    <div class="core-box" id="coreContainer">
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="center-orb" id="orb">HEROVEE</div>
    </div>

    <div id="chatDisplay"></div>

    <div class="controls">
        <button class="action-btn" onclick="startVoiceMode()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="Boss, command me..." onkeypress="if(event.key === 'Enter') askAI()">
        <button class="action-btn send-btn" onclick="askAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAEl8t2m_HZ1oNOC49lmpiiM4-XhGzWRfE", authDomain: "herovee.firebaseapp.com", projectId: "herovee", storageBucket: "herovee.firebasestorage.app", messagingSenderId: "700112828047", appId: "1:700112828047:web:988f0598b5341a29bba2fa" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const orb = document.getElementById('orb');
    const mainUI = document.getElementById('mainUI');
    const chatDisplay = document.getElementById('chatDisplay');
    const API_KEYS = ["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", "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"];

    window.logout = () => signOut(auth).then(() => window.location.href = "index.html");

    // এআই-এর কথা বলা (Text to Speech)
    function speak(text) {
        const synth = window.speechSynthesis;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'bn-BD';
        utter.onstart = () => {
            orb.innerText = "SPEAKING";
            orb.classList.add('speaking-anim');
        };
        utter.onend = () => {
            orb.classList.remove('speaking-anim');
            orb.innerText = "HEROVEE";
            setTimeout(() => mainUI.classList.remove('voice-active'), 1500);
        };
        synth.speak(utter);
    }

    // ভয়েস মোড অন করা
    window.startVoiceMode = () => {
        const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
        recognition.lang = 'bn-BD';
        
        recognition.onstart = () => {
            mainUI.classList.add('voice-active');
            orb.innerText = "LISTENING";
            orb.classList.add('speaking-anim');
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            orb.classList.remove('speaking-anim');
            orb.innerText = "THINKING";
            await processAI(transcript);
        };

        recognition.onerror = () => {
            mainUI.classList.remove('voice-active');
            orb.classList.remove('speaking-anim');
        };

        recognition.start();
    };

    // টেক্সট এবং ভয়েস দুইটার জন্যই মেইন ফাংশন
    window.askAI = async () => {
        const input = document.getElementById('userInput');
        const val = input.value.trim();
        if(!val) return;
        
        chatDisplay.innerHTML += `<div style="color:var(--neon); margin-bottom:10px;">[BOSS]: ${val}</div>`;
        input.value = "";
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
        
        orb.innerText = "THINKING";
        await processAI(val);
    };

    async function processAI(text) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEYS[0]}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "You are HEROVEE, built by Siyam. Today is March 11, 2026. Give brief answers." }, { role: "user", content: text }]
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            chatDisplay.innerHTML += `<div style="color:var(--gold); margin-bottom:10px;">[HEROVEE]: ${reply}</div>`;
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            
            // যদি ভয়েস মোড অন থাকে তবেই কথা বলবে
            if(mainUI.classList.contains('voice-active')) {
                speak(reply);
            } else {
                orb.innerText = "HEROVEE";
            }
        } catch (e) {
            orb.innerText = "ERROR";
            setTimeout(() => orb.innerText = "HEROVEE", 2000);
        }
    }
</script>

</body>
</html>
